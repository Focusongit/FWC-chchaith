<!DOCTYPE html>
<html>
  <head>
    <style>
      .flex {
        display: flex;
        justify-content: center;
      }

      .mickey {
        border: 1px solid black;
        height: 90px;
        width: 250px;
        background-color: lightcoral;
        display: flex;
        align-items: center;
      }

      .donald {
        border: 1px solid black;
        height: 90px;
        width: 250px;
        background-color: lightblue;
        display: flex;
        align-items: center;
      }
      
    </style>
  </head>
  <body>
    <div class="flex">
      <div class="mickey">Mickey mouse</div>
      <div class="donald">Donald duck</div>
    </div>
  </body>
</html>
