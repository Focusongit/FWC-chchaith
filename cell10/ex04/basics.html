<!DOCTYPE html>
<html>
  <head>
    <title>Basics</title>
    <style>
      body {
        background-color: pink;
      }

      .title {
        color: white;
        text-align: center;
        font-size: 70px;
      }

      .picture {
        display: flex;
        width: 300px;
        height: 200px;
        object-fit: cover;
      }

      .flex {
        display: flex;
        justify-content: center;
      }

      .shop-link {
        display: block;
        margin-top: 50px;
        margin-top: 15px;
        text-align: center;
        cursor: pointer;
      }

      .line {
        height: 2px;
        background-color: rgb(12, 111, 12);
        margin-top: 50px;
      }

      .copyright {
        font-family: monospace;
        font-style: italic;
        text-align: right;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Basics ö</h1>
    <div class="flex">
      <div class="">
        <img class="picture" src="../../shopee.webp">
        <a class="shop-link" target="_blank" href="https://shopee.co.th/">https://shopee.co.th/</a>
      </div>
      <div>
        <img class="picture" src="../../tiktok_shop.webp">
        <a class="shop-link" target="_blank" href="https://shop.tiktok.com/th">https://shop.tiktok.com/th</a>
      </div>
    </div>
    <div class="line"> </div>
    <div class="copyright">© chchaith 2026</div>

  </body>
</html>
